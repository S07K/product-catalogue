server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Re-resolve the API hostname via Docker's embedded DNS. With a literal
  # `proxy_pass http://api:3000`, nginx resolves the name once at startup and
  # keeps using that IP forever, so after the API container restarts (new IP) every
  # request fails with 502 until nginx is restarted too. Using a variable forces
  # runtime resolution, cached for 10s. (In AWS, /api would route via an ALB instead.)
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api_upstream http://api:3000;

  # Same-origin API: the browser only ever talks to this host, so no CORS is needed.
  # (The API sets its own security headers via helmet.)
  location /api/ {
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Fingerprinted build assets can be cached forever.
  location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # SPA fallback: client-side routes (e.g. /products/3) serve index.html.
  location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri /index.html;
  }
}
