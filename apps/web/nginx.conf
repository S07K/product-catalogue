server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Same-origin API: the browser only ever talks to this host, so no CORS is needed.
  # (The API sets its own security headers via helmet.)
  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Fingerprinted build assets can be cached forever.
  location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # SPA fallback: client-side routes (e.g. /products/3) serve index.html.
  location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri /index.html;
  }
}
