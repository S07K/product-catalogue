# Included in every location: nginx drops server-level add_header directives in any
# location that declares its own add_header, so headers must be repeated per location.
# Product images come from the product source's CDN, hence https: for img-src.
add_header Content-Security-Policy "default-src 'self'; img-src 'self' https: data:; style-src 'self'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
